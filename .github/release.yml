# Release notes, grouped by the conventional title of each merged PR.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: CI and tooling
      labels: [ci]
    - title: Other changes
      labels: ["*"]
