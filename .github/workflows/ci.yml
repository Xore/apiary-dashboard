name: CI

# Every pull request and every push to main: the fast gates in one job,
# the release gate (scripts/smoke.sh: clean clone, production build, HTTP,
# crawl, responsive, accessibility and performance checks) in another.
# GitHub-hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.2"

jobs:
  public-safety:
    name: Public repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/check-public-leaks.ts

  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # TanStack moves fast and its packages must move together: exact
      # versions only, never a range or `latest` (APIARY #2180).
      - name: TanStack dependencies are pinned exactly
        run: |
          loose="$(jq -r '((.dependencies // {}) + (.devDependencies // {}))
              | to_entries[]
              | select(.key | startswith("@tanstack/"))
              | select(.value | test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)
              | "\(.key) \(.value)"' package.json)"
          if [ -n "$loose" ]; then
            echo "::error::@tanstack dependencies must be pinned to an exact version:"
            echo "$loose"
            exit 1
          fi
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run test
      - name: Theme outputs match their source
        run: bun run theme:check
      - name: Generated server-function facade is current
        run: bun scripts/gen-queries.ts --check
      - run: bun run build
      - name: Generated route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

  smoke:
    name: Release gate (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The browser checks use the runner image's Google Chrome.
      - run: test -x /usr/bin/google-chrome
      # smoke.sh clones a branch; give the checked-out commit one.
      - run: git checkout -B ci-smoke
      - run: scripts/smoke.sh "$PWD" ci-smoke

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
