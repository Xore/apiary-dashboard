name: Dependabot auto-merge

# Patch and minor updates merge by themselves once every required check is
# green (auto-merge waits for them). Majors, and minors of 0.x packages
# (which may break), wait for a person, as in APIARY.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  compatible-update:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Hold 0.x minor bumps for a person
        id: zero-major
        env:
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          held="$(jq -r '[.[] | select(.updateType == "version-update:semver-minor" and ((.prevVersion // "") | startswith("0.")))
                             | "\(.dependencyName) \(.prevVersion) -> \(.newVersion)"] | join(", ")' <<<"${DEPS:-[]}")"
          if [ -n "$held" ]; then
            echo "hold=true" >>"$GITHUB_OUTPUT"
            echo "::notice::0.x minor bump, not auto-merging: $held"
          fi
      - name: Merge when green
        if: >-
          steps.zero-major.outputs.hold != 'true' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
