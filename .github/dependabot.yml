version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Berlin
    groups:
      # TanStack's packages move together (CI demands exact pins).
      tanstack:
        patterns: ["@tanstack/*"]
      compatible:
        patterns: ["*"]
        exclude-patterns: ["@tanstack/*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    labels: [dependencies]
