version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  # No `bun` entry: Dependabot's Bun updater reads bun.lock format 1 only,
  # and Bun 1.4 writes format 2 (#95). workflows/bun-update.yml opens the
  # weekly update PR instead; security advisories still arrive through the
  # dependency graph.

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    labels: [dependencies]
